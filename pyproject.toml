[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csl-tools"
version = "1.1.0"
description = "Tools for import, export and curation of spectral data for the CSL (Collective Spectral Library)."
authors = [
    { name = "Ole Lessmann", email = "lessmann@bafg.de" },
    { name = "Björn Ehlig", email = "ehlig@bafg.de" },
    { name = "Kevin S. Jewell", email = "jewell@bafg.de" },
    { name = "Arne Wick", email = "wick@bafg.de" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.1,<3",
    "numpy>=2.3.1,<3",
    "sqlalchemy>=2.0.41,<3",
    "rdkit>=2025.3.3,<2026",
    "tqdm>=4.67.1,<5",
    "scipy>=1.16.0,<2",
    "joblib>=1.5.1,<2",
    "splash @ git+https://github.com/berlinguyinca/spectra-hash.git@174fbf289a0357535f9bacda282b9a2dbb7807cc#egg=splash&subdirectory=python",
    "pubchempy>=1.0.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1,<9",
    "PyYAML>=6.0,<7",
    "tabulate>=0.9.0,<1",
    "openpyxl>=3.1.2,<4",
    "pytest-mock>=3.15.1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests/unit",
    "tests/integration",
]

[project.scripts]
csl = "csl.main:main"