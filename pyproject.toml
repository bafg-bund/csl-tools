[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "csl-tools"
version = "0.1.0"
description = "Tools for import, export and curation of spectral data for the CSL (Collective Spectral Library)."
authors = [
    { name = "Ole Lessmann", email = "lessmann@bafg.de" },
    { name = "Björn Ehlig", email = "ehlig@bafg.de" },
    { name = "Kevin S. Jewell", email = "jewell@bafg.de" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.1",
    "numpy>=2.3.1",
    "sqlalchemy>=2.0.41",
    "pytest>=8.4.1",
    "rdkit>=2025.3.3",
    "tqdm>=4.67.1",
    "scipy>=1.16.0",
    "joblib>=1.5.1",
    "splash @ git+https://github.com/berlinguyinca/spectra-hash.git@174fbf289a0357535f9bacda282b9a2dbb7807cc#egg=splash&subdirectory=python",
    "pubchempy>=1.0.4",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests/unit",
    "tests/integration",
]

[project.scripts]
csl = "csl.main:main"